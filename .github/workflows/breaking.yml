name: Breaking news and Trump posts check

on:
  schedule:
    # backup only: the Cloudflare Worker starts this workflow every 10 minutes; GitHub's own timer runs hourly in case that ever stops
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check (post for real) | dry (print only, post nothing)"
        default: "dry"
      window_min:
        description: "minutes back to look for Trump posts (empty = 90). For a test use 2880 to see the last two days"
        default: ""

permissions:
  contents: read

concurrency:
  group: channel-posts   # shared with bot.yml: only one job posts to the channel at a time
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # several posts are sent one minute apart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # remembers when the last channel post was sent (one post per minute, also across workflows)
      - uses: actions/cache@v4
        with:
          path: state/last_post.json
          key: lastpost-${{ github.run_id }}
          restore-keys: lastpost-

      # remembers which stories and which Trump posts were already seen, so nothing is posted twice
      - uses: actions/cache@v4
        with:
          path: |
            state/breaking_seen.json
            state/trump_seen.json
          key: breaking-${{ github.run_id }}
          restore-keys: breaking-

      - name: Check feeds
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRUMP_WINDOW_MIN: ${{ github.event.inputs.window_min || vars.TRUMP_WINDOW_MIN }}
          TRUMP_MIN_SCORE: ${{ vars.TRUMP_MIN_SCORE }}
          TRUMP_MAX_PER_DAY: ${{ vars.TRUMP_MAX_PER_DAY }}
          TRUMP_FEED_URL: ${{ vars.TRUMP_FEED_URL }}
          TRUMP_SHOW_ORIGINAL: ${{ vars.TRUMP_SHOW_ORIGINAL }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "${INPUT_MODE:-check}" = "dry" ]; then
            python bot.py --mode breaking --dry-run
          else
            python bot.py --mode breaking
          fi
